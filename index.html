    .glass-card { background: rgba(20, 28, 40, 0.5); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.05); }
    .leaflet-container { background: #1a1f2e; }
    .map-shell { position: relative; border-radius: 1rem; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 50px rgba(0,0,0,0.35); }
    .map-overlay { position: absolute; z-index: 500; top: 10px; right: 10px; background: rgba(8, 12, 20, 0.72); border: 1px solid rgba(255,255,255,0.15); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-radius: 12px; padding: 10px; width: 170px; }
    .map-overlay h4 { font-size: 12px; color: #d1d5db; margin-bottom: 6px; font-weight: 600; }
    .legend-row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #cbd5e1; margin-top: 6px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 9999px; margin-right: 6px; display: inline-block; }
    .pulse-dot { width: 14px; height: 14px; border-radius: 9999px; background: #60a5fa; border: 2px solid rgba(255,255,255,0.85); box-shadow: 0 0 0 rgba(96,165,250,0.8); animation: pulse 1.8s infinite; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(96,165,250,0.75); }

      100% { box-shadow: 0 0 0 0 rgba(96,165,250,0); }

    // Get nested translation value
    const getNestedValue = (obj, path) => {
      return path.split('.').reduce((current, key) => current && current[key], obj);
    };

    // Translation hook factory
    const createUseTranslation = (initialLang = 'en') => {
      let currentLang = initialLang;
      const listeners = new Set();

      // Load from localStorage if available
      try {
        const saved = localStorage.getItem('weathery-language');
        if (saved && translations[saved]) {
          currentLang = saved;
        }
      } catch (e) {}

      const setLanguage = (lang) => {
        if (translations[lang]) {
          currentLang = lang;
          try {
            localStorage.setItem('weathery-language', lang);
          } catch (e) {}
          listeners.forEach(fn => fn(lang));
        }
      };

      const t = (key, params = {}) => {
        let text = getNestedValue(translations[currentLang], key) || getNestedValue(translations['en'], key) || key;
        
        // Replace parameters like {n} with actual values
        Object.keys(params).forEach(param => {
          text = text.replace(new RegExp(`\\{${param}\\}`, 'g'), params[param]);
        });
        
        return text;
      };

      const subscribe = (fn) => {
        listeners.add(fn);
        return () => listeners.delete(fn);
      };

      return { t, setLanguage, getLanguage: () => currentLang, subscribe };
    };

    // Create global translation instance
    const i18n = createUseTranslation('en');

    // React Context for translations
    const I18nContext = React.createContext(i18n);

    // Hook to use translations with auto-re-render
    const useTranslation = () => {
      const [, setUpdate] = React.useState(0);
      const i18nRef = React.useRef(i18n);
      
      React.useEffect(() => {
        const unsubscribe = i18nRef.current.subscribe(() => {
          setUpdate(n => n + 1);
        });
        return unsubscribe;
      }, []);
      
      return i18nRef.current;
    };

    // Location verification utilities
    const calculateDistance = (lat1, lon1, lat2, lon2) => {
      const R = 6371; // Earth's radius in km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    };

    const getAccuracyLevel = (accuracy) => {
      if (accuracy <= 100) return { level: 'high', label: 'High', color: '#10b981' };
      if (accuracy <= 500) return { level: 'medium', label: 'Medium', color: '#f59e0b' };
      return { level: 'low', label: 'Low', color: '#ef4444' };
    };

        case 'device-network': return '📡';
        case 'ip-fallback': return '🌐';
        default: return '❓';
      }

    const isMeaningfulText = (value) => {
      if (!value || typeof value !== 'string') return false;
      const trimmed = value.trim();
      if (!trimmed) return false;
      if (/^unknown/i.test(trimmed)) return false;
      if (/^[A-Z]{2}-[A-Z0-9-]+$/.test(trimmed)) return false;
      return true;
    };

    const buildLocationLabel = (hierarchy, fallback = 'Current Location') => {
      const city = isMeaningfulText(hierarchy?.city) ? hierarchy.city : null;
      const country = isMeaningfulText(hierarchy?.country) ? hierarchy.country : null;
      if (city && country) return `${city}, ${country}`;
      if (city) return city;
      return fallback;
    };

    async function geocodeCity(city) {
      // Try Open-Meteo geocoding first (good for India)
      try {
        const res = await axios.get('https://geocoding-api.open-meteo.com/v1/search', {
          params: { name: city, count: 10, language: 'en', format: 'json' }
        });
        
        if (res.data?.results && res.data.results.length > 0) {
          // Boost Indian results if the query seems Indian
          const isIndianQuery = /india|andhra|visakhapatnam|vijayawada|guntur|tirupati| Nellore|kakinada|rajahmundry|kadapa|anantapur|kurnool|chittoor|ap\s/i.test(city);
          
          let results = res.data.results.map(r => ({
            name: r.name,
            latitude: r.latitude,
            longitude: r.longitude,
            country: r.country || '',
            country_code: r.country_code || '',
            admin1: r.admin1 || '', // State
            admin2: r.admin2 || '', // District
            admin3: r.admin3 || '', // Sub-district
            admin4: r.admin4 || '',
            score: r.score || 1
          }));
          
          // If Indian query, prioritize Indian results
          if (isIndianQuery) {
            results.sort((a, b) => {
              const aIsIndia = a.country_code === 'IN' ? 1 : 0;
              const bIsIndia = b.country_code === 'IN' ? 1 : 0;
              return bIsIndia - aIsIndia;
            });
          }
          
          return results;
        }
      } catch (e) {
        console.warn('Open-Meteo geocoding failed:', e.message);
      }
      
      // Fallback to Nominatim (OpenStreetMap) for better India coverage
      try {
        const res = await axios.get('https://nominatim.openstreetmap.org/search', {
          params: {
            q: city + ' India',
            format: 'json',
            addressdetails: 1,
            limit: 10
          },
          headers: {
            'User-Agent': 'WeatheryApp/1.0'
          }
        });
        
        if (res.data && res.data.length > 0) {
          return res.data.map(r => ({
            name: r.name || r.display_name.split(',')[0],
            latitude: parseFloat(r.lat),
            longitude: parseFloat(r.lon),
            country: r.address?.country || '',
            country_code: r.address?.country_code?.toUpperCase() || '',
            admin1: r.address?.state || '',
            admin2: r.address?.county || r.address?.district || '',
            admin3: r.address?.subdistrict || r.address?.municipality || '',
            admin4: r.address?.town || r.address?.village || '',
            score: 0.9
          }));
        }
      } catch (e) {
        console.warn('Nominatim geocoding failed:', e.message);
      }
      
      return [];
    }

    async function fetchIpLocationFallback() {
      // Try multiple IP geolocation services for better India coverage
      const services = [
        // ipapi.co (original)
        async () => {
          const res = await axios.get('https://ipapi.co/json/');
          const d = res.data || {};
          if (typeof d.latitude === 'number' && typeof d.longitude === 'number') {
            return {
              lat: d.latitude,
              lon: d.longitude,
              city: d.city || '',
              country: d.country_code || d.country_name || '',
              region: d.region || '',
              state: d.region || ''
            };
          }
          return null;
        },
        // ip-api.com (fallback)
        async () => {
          try {
            const res = await axios.get('http://ip-api.com/json/?fields=status,message,country,countryCode,region,regionName,city,lat,lon,timezone,isp,org,as');
            const d = res.data || {};
            if (d.status === 'success' && d.lat && d.lon) {
              return {
                lat: d.lat,
                lon: d.lon,
                city: d.city || '',
                country: d.countryCode || d.country || '',
                region: d.regionName || '',
                state: d.regionName || ''
              };
            }
          } catch (e) {
            // HTTP fallback might be blocked
          }
          return null;
        }
      ];

      for (const service of services) {
        try {
          const result = await service();
          if (result) return result;
        } catch {
          continue;
        }
      }
      return null;
    }

    async function fetchLocationHierarchy(lat, lon) {
      let openMeteoLocation = null;
      try {
        const reverse = await axios.get('https://geocoding-api.open-meteo.com/v1/reverse', {
          params: {
            latitude: lat,
            longitude: lon,
            language: 'en',
            format: 'json',
            count: 1
          }
        });
        const item = reverse.data?.results?.[0];
        if (item) {
          openMeteoLocation = {
            city: item.name || item.admin3 || item.admin2 || item.admin1 || '',
            country: item.country_code || item.country || '',
            state: item.admin1 || '',
            district: item.admin2 || item.admin3 || '',
            subdistrict: item.admin4 || item.admin3 || ''
          };
        }
      } catch {
        openMeteoLocation = null;
      }

      try {
        const res = await axios.get('https://api.bigdatacloud.net/data/reverse-geocode-client', {
          params: {
            latitude: lat,
            longitude: lon,
            localityLanguage: 'en'
          }
        });
        const data = res.data || {};
        
        // Enhanced handling for Indian locations (Andhra Pradesh and other states)
        const getIndianAdminLevel = (data) => {
          // For India, try to get proper district and sub-district info
          const locality = data.locality || data.localityInfo?.administrative?.[3]?.name || '';
          const subdistrict = data.sublocality || data.localityInfo?.administrative?.[2]?.name || '';
          const district = data.principalSubdivision || data.localityInfo?.administrative?.[1]?.name || '';
          const state = data.principalSubdivision || data.localityInfo?.administrative?.[0]?.name || '';
          
          return { locality, subdistrict, district, state };
        };
        
        const indianData = getIndianAdminLevel(data);
        
        const merged = {
          city: openMeteoLocation?.city || data.city || data.locality || indianData.locality || 'Unknown City',
          country: openMeteoLocation?.country || data.countryCode || data.countryName || '',
          state: openMeteoLocation?.state || indianData.state || data.principalSubdivision || 'Unknown State',
          district: openMeteoLocation?.district || indianData.district || data.localityInfo?.administrative?.[1]?.name || 'Unknown District',
          subdistrict: openMeteoLocation?.subdistrict || indianData.subdistrict || indianData.locality || 'Unknown Subdistrict'
        };
        
        // Special handling for Andhra Pradesh cities
        const apCities = ['Visakhapatnam', 'Vijayawada', 'Guntur', 'Tirupati', 'Nellore', 'Kakinada', 'Rajahmundry', 'Kadapa', 'Anantapur', 'Kurnool', 'Chittoor', 'East Godavari', 'West Godavari', 'Prakasam', 'Srikakulam', 'Vizianagaram', 'Prakasam'];
        if (apCities.some(city => merged.city.toLowerCase().includes(city.toLowerCase())) || merged.state?.toLowerCase().includes('andhra')) {
          // For AP, use locality as subdistrict
          merged.subdistrict = indianData.locality || merged.subdistrict;
        }
        
        return {
          city: merged.city,
          country: merged.country,
          state: merged.state,
          district: merged.district,
          subdistrict: merged.subdistrict
        };
      } catch {
        if (openMeteoLocation) {
          return {
            city: openMeteoLocation.city || 'Unknown City',
            country: openMeteoLocation.country || '',
            state: openMeteoLocation.state || 'Unknown State',
            district: openMeteoLocation.district || 'Unknown District',
            subdistrict: openMeteoLocation.subdistrict || 'Unknown Subdistrict'
          };
        }
        return {
          city: 'Unknown City',
          country: '',
          state: 'Unknown State',
          district: 'Unknown District',
          subdistrict: 'Unknown Subdistrict'
        };
      }
    }

    // ==================== AIR QUALITY API SERVICE ====================
    // Free Air Quality APIs:
    // 1. Open-Meteo Air Quality API (FREE, no key required)
    //    - Rate: Unlimited for non-commercial use
    //    - Coverage: Global
    //    - Data: AQI, PM2.5, PM10, O3, NO2, SO2, CO
    //
    // 2. WAQI (World Air Quality Index) - API token required
    //    - Rate: Free tier: 3 requests/minute
    //    - Coverage: Global
    //
    // 3. OpenAQ - Free, requires API key
    //    - Rate: 1000 requests/day
    //    - Coverage: Global

    // Cache for air quality data
    const airQualityCache = new Map();
    const CACHE_DURATION = 10 * 60 * 1000; // 10 minutes

    // Get AQI color based on value
    const getAQIColor = (aqi) => {
      if (aqi <= 50) return { color: '#10b981', bg: 'bg-green-500', label: 'Good', health: 'Air quality is satisfactory' };
      if (aqi <= 100) return { color: '#facc15', bg: 'bg-yellow-500', label: 'Moderate', health: 'Acceptable air quality' };
      if (aqi <= 150) return { color: '#f97316', bg: 'bg-orange-500', label: 'Unhealthy for Sensitive', health: 'Sensitive groups may experience effects' };
      if (aqi <= 200) return { color: '#ef4444', bg: 'bg-red-500', label: 'Unhealthy', health: 'Everyone may experience effects' };
      if (aqi <= 300) return { color: '#a855f7', bg: 'bg-purple-500', label: 'Very Unhealthy', health: 'Health warnings of emergency conditions' };
      return { color: '#7f1d1d', bg: 'bg-red-900', label: 'Hazardous', health: 'Health alert: serious effects' };
    };

    // Fetch air quality data from Open-Meteo API
    async function fetchAirQuality(lat, lon) {
      const cacheKey = `${lat.toFixed(2)}_${lon.toFixed(2)}`;
      const cached = airQualityCache.get(cacheKey);
      
      if (cached && Date.now() - cached.timestamp < CACHE_DURATION) {
        return cached.data;
      }
      
      try {
        const res = await axios.get('https://air-quality-api.open-meteo.com/v1/air-quality', {
          params: {
            latitude: lat,
            longitude: lon,
            current: 'us_aqi,pm2_5,pm10,ozone,nitrogen_dioxide,sulphur_dioxide,carbon_monoxide,dust,uv_index',
            timezone: 'auto'
          },
          timeout: 8000
        });
        
        const data = res.data;
        const current = data.current;
        
        const result = {
          aqi: current?.us_aqi || 0,
          pm25: current?.pm2_5 || 0,
          pm10: current?.pm10 || 0,
          o3: current?.ozone || 0,
          no2: current?.nitrogen_dioxide || 0,
          so2: current?.sulphur_dioxide || 0,
          co: current?.carbon_monoxide || 0,
          dust: current?.dust || 0,
          uv: current?.uv_index || 0,
          timestamp: data.current?.time || new Date().toISOString()
        };
        
        // Cache the result
        airQualityCache.set(cacheKey, { data: result, timestamp: Date.now() });
        
        return result;
      } catch (e) {
        console.warn('Air quality fetch failed:', e.message);
        return null;
      }
    }

    // Get health recommendations based on AQI
    const getHealthRecommendations = (aqi) => {
      if (aqi <= 50) {
        return [
          'Air quality is good - ideal for outdoor activities',
          'Perfect for exercise and recreation',
          'No restrictions for sensitive groups'
        ];
      } else if (aqi <= 100) {

          'Children and elderly may experience minor effects'
        ];
      } else if (aqi <= 150) {
        return [
          'Members of sensitive groups may experience health effects',
          'General public is less likely to be affected',

        ];
      } else if (aqi <= 200) {
        return [

      } else if (aqi <= 300) {
        return [
          'Health warnings of emergency conditions',
          'Stay indoors and use air purification',
          'Avoid all outdoor physical activities'

          'Health alert: everyone may experience serious health effects',
          'Remain indoors and keep windows closed',

    // ==================== AI ASSISTANT BOT ====================
    const AIAssistantBot = ({ currentWeather, currentLocation, locationDetails }) => {
      const [isOpen, setIsOpen] = React.useState(false);
      const [isDragging, setIsDragging] = React.useState(false);
      const [position, setPosition] = React.useState({ x: 20, y: 20 });
      const [messages, setMessages] = React.useState(() => [
        {

          speaking: false
        }
      ]);
      const [input, setInput] = React.useState('');

      const [speakingMessageId, setSpeakingMessageId] = React.useState(null);
      const [isPaused, setIsPaused] = React.useState(false);
      const messagesEndRef = React.useRef(null);

      const botRef = React.useRef(null);
      const recognitionRef = React.useRef(null);
      const synthRef = React.useRef(null);
      const utteranceRef = React.useRef(null);
      const lastQueryRef = React.useRef('');

      useTranslation();

      // Initialize speech recognition and synthesis
      React.useEffect(() => {
        if (typeof window !== 'undefined') {
          const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (SpeechRecognition) {
            recognitionRef.current = new SpeechRecognition();
            recognitionRef.current.continuous = false;
            recognitionRef.current.interimResults = true;
            recognitionRef.current.lang = 'en-US';
            
            recognitionRef.current.onresult = (event) => {
              const transcript = Array.from(event.results)
                .map(result => result[0])
                .map(result => result.transcript)
                .join('');
              
              if (event.results[0].isFinal) {
                setInput(transcript);
                setIsListening(false);
              }
            };
            
            recognitionRef.current.onerror = (event) => {
              console.error('Speech recognition error:', event.error);
              setIsListening(false);
            };
            
            recognitionRef.current.onend = () => {
              setIsListening(false);
            };
          }
          
          synthRef.current = window.speechSynthesis;
        }
        
        return () => {
          if (recognitionRef.current) {
            recognitionRef.current.stop();
          }
          if (synthRef.current) {
            synthRef.current.cancel();
          }
        };
      }, []);

      // Handle voice input toggle
      const toggleVoiceInput = () => {
        if (isListening) {
          recognitionRef.current?.stop();
          setIsListening(false);
        } else {
          setIsListening(true);
          try {
            recognitionRef.current?.start();
          } catch (e) {
            console.error('Failed to start recognition:', e);
            setIsListening(false);
          }
        }
      };

      // Handle text-to-speech for a message
      const speakMessage = (text, messageId) => {
        if (!synthRef.current) return;
        
        // Stop any current speech
        synthRef.current.cancel();
        setIsPaused(false);
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 1;
        utterance.pitch = 1;
        utterance.volume = 1;
        
        utterance.onstart = () => {
          setSpeakingMessageId(messageId);
        };
        
        utterance.onend = () => {
          setSpeakingMessageId(null);
          setIsPaused(false);
        };
        
        utterance.onerror = () => {
          setSpeakingMessageId(null);
          setIsPaused(false);
        };
        
        utteranceRef.current = utterance;
        synthRef.current.speak(utterance);
      };

      // Pause/resume speech
      const togglePause = () => {
        if (!synthRef.current) return;
        
        if (isPaused) {
          synthRef.current.resume();
          setIsPaused(false);
        } else {
          synthRef.current.pause();
          setIsPaused(true);
        }
      };

      // Stop speech
      const stopSpeaking = () => {
        if (synthRef.current) {
          synthRef.current.cancel();
        }
        setSpeakingMessageId(null);
        setIsPaused(false);
      };

      // Improved response logic with context awareness

      const getWeatherResponse = (query, context = {}) => {
        const lowerQuery = query.toLowerCase();
        const { lastTopic, lastLocation } = context;
        
        // Check for implicit references - maintain context from previous questions
        const implicitThis = lowerQuery.includes('it') || lowerQuery.includes('this') || lowerQuery.includes('that') || lowerQuery.includes('there');

        // Check current weather conditions - provide complete answers without clarification

        // Check knowledge base - provide comprehensive answers

        };
        
        for (const [key, value] of Object.entries(knowledgeResponses)) {

        // Greetings - contextual based on time

        }
        if (lowerQuery.includes('thank')) {
          return `You're welcome! ${currentWeather ? `Currently ${currentWeather.description} outside. ` : ''}Feel free to ask more weather questions! 😊`;
        }
        if (lowerQuery.includes('help')) {
          return `I can help you with:\n• Current weather conditions (temperature, humidity, wind, rain)\n• Weather forecasts (hourly, daily, 14-day)\n• Weather phenomena explanations (monsoon, cyclones, etc.)\n• Air quality information (AQI, pollutants)\n• UV and sun protection advice\n• General weather knowledge\n\nJust ask your question naturally!`;
        }
        if (lowerQuery.includes('location') || lowerQuery.includes('where') || lowerQuery.includes('city') || lowerQuery.includes('place')) {
          return `You're currently viewing weather for ${currentLocation || 'your location'}. ${locationDetails?.state ? `Located in ${locationDetails.state}, ${locationDetails.district || ''}.` : ''} ${currentWeather ? `Current conditions: ${currentWeather.temp_c}°C, ${currentWeather.description}.` : ''}`;
        }
        if (lowerQuery.includes('time') || lowerQuery.includes('when')) {
          return `The current time is ${new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}. ${currentWeather ? `Weather data was last updated recently.` : ''}`;
        }
        if (lowerQuery.includes('best') || lowerQuery.includes('good') || lowerQuery.includes('ideal') || lowerQuery.includes('perfect')) {
          if (lowerQuery.includes('time') || lowerQuery.includes('visit') || lowerQuery.includes('travel') || lowerQuery.includes('trip')) {
            return `The best time to visit Vizianagaram is from October to March when temperatures are comfortable (15-28°C) and humidity is moderate. Monsoon (June-September) brings heavy rainfall. Summer (March-May) can be very hot with temperatures above 35°C.`;
          }
        }
        
        // Store this query for context
        lastQueryRef.current = query;
        
        // Provide helpful response even for unclear questions
        if (lowerQuery.length < 5) {
          return `I want to make sure I help you correctly. Could you tell me more about what you'd like to know? ${currentWeather ? `Currently it's ${Math.round(currentWeather.temp_c)}°C in ${currentLocation || 'your location'}.` : ''}`;
        }
        
        // Comprehensive default response
        const topic = lowerQuery.split(' ').find(w => knowledgeResponses[w]) || 'weather';
        return `I understand you're asking about "${query}". While I specialize in weather information, I can help explain weather concepts, current conditions, and forecasts. ${currentWeather ? `Currently in ${currentLocation || 'your location'}, it's ${Math.round(currentWeather.temp_c)}°C with ${currentWeather.description}.` : ''} Could you rephrase your question?`;
      };

      const handleSend = () => {
        if (!input.trim()) return;
        
        const userMessage = {
          id: Date.now(),
          type: 'user',
          text: input,
          timestamp: new Date(),
          speaking: false
        };
        
        // Stop any current speech when new message is sent
        stopSpeaking();
        
        setMessages(prev => [...prev, userMessage]);
        setInput('');
        setIsTyping(true);
        
        // Get context from previous messages
        const context = {
          lastTopic: lastQueryRef.current,
          lastLocation: currentLocation
        };
        
        // Simulate AI thinking
        setTimeout(() => {
          const response = getWeatherResponse(input, context);
          const botMessage = {
            id: Date.now() + 1,
            type: 'bot',
            text: response,
            timestamp: new Date(),
            speaking: false
          };
          setMessages(prev => [...prev, botMessage]);
          setIsTyping(false);
        }, 800 + Math.random() * 500);
      };

      // Auto-scroll to bottom
      React.useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      // Handle dragging
      const handleMouseDown = (e) => {
        setIsDragging(true);
        const rect = botRef.current.getBoundingClientRect();
        dragOffset.current = {
          x: e.clientX - rect.left,
          y: e.clientY - rect.top
        };
      };

      const handleMouseMove = (e) => {
        if (!isDragging) return;
        const newX = e.clientX - dragOffset.current.x;
        const newY = e.clientY - dragOffset.current.y;
        setPosition({ x: Math.max(0, newX), y: Math.max(0, newY) });
      };

      const handleMouseUp = () => {
        setIsDragging(false);
      };

      // Format timestamp
      const formatTime = (date) => {
        return date.toLocaleTimeString('en-US', { 
          hour: '2-digit', 
          minute: '2-digit',
          hour12: true 
        });
      };

      return (
        <div 
          ref={botRef}
          className="fixed z-50"
          style={{ 
            right: position.x, 
            bottom: position.y,

          }}
          onMouseMove={handleMouseMove}
          onMouseUp={handleMouseUp}
          onMouseLeave={handleMouseUp}
        >
          {/* Chat Interface */}
          {isOpen && (
            <div className="mb-3 w-80 bg-gray-900/95 backdrop-blur-xl rounded-2xl border border-white/20 shadow-2xl overflow-hidden animate-fadeIn">
              {/* Header */}
              <div className="bg-gradient-to-r from-blue-500 to-purple-500 p-3 flex items-center justify-between">
                <div className="flex items-center gap-2">

                    <span className="text-lg">🤖</span>
                  </div>

                    <p className="text-white font-medium text-sm">{i18n.t('aiAssistant')}</p>

                    >

                      {msg.type === 'bot' && (
                        <div className="flex items-center gap-2 mt-2 pt-2 border-t border-white/10">
                          {speakingMessageId === msg.id ? (
                            <>
                              <button
                                onClick={togglePause}
                                className="w-7 h-7 rounded-full bg-white/20 hover:bg-white/30 flex items-center justify-center transition-all"
                                title={isPaused ? i18n.t('resume') : i18n.t('pause')}

                                <span className="text-xs">⏹️</span>

    const AirQualityPanel = ({ airQuality, locationName, onClose }) => {
      if (!airQuality) {

    // Air Quality Map Layer Component
    const AQIMapLayer = ({ coords, onMarkerClick }) => {

      const [error, setError] = React.useState(null);

      React.useEffect(() => {
        let mounted = true;
        
        const fetchData = async () => {
          setLoading(true);
          setError(null);
          try {
            const data = await fetchAirQuality(coords.lat, coords.lon);

              setAirQuality(data);
              setLoading(false);

          } catch (err) {

    async function fetchForecastBundle(lat, lon) {
      const res = await axios.get('https://api.open-meteo.com/v1/forecast', {
        params: {
          latitude: lat,
          longitude: lon,
          timezone: 'auto',
          forecast_days: 14,
          temperature_unit: 'celsius',
          wind_speed_unit: 'kmh',
          current: 'temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,is_day',
          daily: 'weather_code,temperature_2m_max,temperature_2m_min,uv_index_max,sunrise,sunset,precipitation_probability_max',
          hourly: 'visibility,temperature_2m,weather_code,precipitation_probability'
        }
      });
      return res.data;
    }

    async function fetchHistory(lat, lon) {
      const end = new Date();
      const start = new Date();
      start.setDate(end.getDate() - 6);
      const toISO = (d) => d.toISOString().split('T')[0];
      const res = await axios.get('https://archive-api.open-meteo.com/v1/archive', {
        params: {
          latitude: lat,
          longitude: lon,
          start_date: toISO(start),
          end_date: toISO(end),
          timezone: 'auto',
          temperature_unit: 'celsius',
          daily: 'temperature_2m_max,temperature_2m_min,precipitation_sum,weather_code'
        }
      });
      return res.data;
    }

        Cloud: '☁️', Sun: '☀️', Rain: '🌧️', Snow: '❄️', Lightning: '⚡',
        wind: '💨', uv: '☀️', humidity: '💧', visibility: '👁️', location: '📍'
      };

    // Bengaluru location constants
    const BENGALURU_COORDS = { lat: 12.9716, lon: 77.5946 };
    const BENGALURU_NAME = 'Bengaluru, Karnataka, India';

    // Fetch nearby landmarks using reverse geocoding
    async function fetchNearbyLandmarks(lat, lon) {
      try {
        // Use BigDataCloud for reverse geocoding
        const res = await axios.get('https://api.bigdatacloud.net/data/reverse-geocode-client', {
          params: { latitude: lat, longitude: lon, localityLanguage: 'en' }
        });
        const data = res.data || {};
        
        const landmarks = [];
        
        // Extract nearby places from localityInfo
        if (data.localityInfo?.informative) {
          data.localityInfo.informative.slice(0, 8).forEach(item => {
            if (item.name && item.name !== data.city) {
              landmarks.push({
                name: item.name,
                type: item.entityType || 'area',
                distance: item.geoPoint ? calculateDistance(lat, lon, item.geoPoint.latitude, item.geoPoint.longitude).toFixed(1) : null
              });
            }
          });
        }
        
        // Add local area info
        if (data.locality) landmarks.unshift({ name: data.locality, type: 'Locality', distance: '0' });
        if (data.sublocality) landmarks.unshift({ name: data.sublocality, type: 'Sublocality', distance: '0.5' });
        if (data.city) landmarks.unshift({ name: data.city, type: 'City', distance: '0' });
        
        return landmarks.slice(0, 10);
      } catch (e) {
        console.warn('Failed to fetch landmarks:', e);
        return [
          { name: 'Bangalore Palace', type: 'Landmark', distance: '2.1' },
          { name: 'MG Road', type: 'Commercial', distance: '1.5' },
          { name: 'Cubbon Park', type: 'Park', distance: '1.8' },
          { name: 'Vidhana Soudha', type: 'Government', distance: '2.5' },
          { name: 'UB City', type: 'Commercial', distance: '2.0' },
          { name: 'Kanteerava Stadium', type: 'Stadium', distance: '2.8' },
          { name: 'Bengaluru City Railway Station', type: 'Transport', distance: '3.2' },
          { name: 'ISKCON Temple', type: 'Temple', distance: '4.1' }
        ];
      }
    }

    // Fetch weather for Bengaluru
    async function fetchBengaluruWeather(lat, lon) {
      try {
        const res = await axios.get('https://api.open-meteo.com/v1/forecast', {
          params: {
            latitude: lat,
            longitude: lon,
            timezone: 'Asia/Kolkata',
            current: 'temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,is_day',
            hourly: 'temperature_2m,weather_code,precipitation_probability'
          }
        });
        const current = res.data?.current;
        const hourly = res.data?.hourly;
        
        if (!current) return null;
        
        const weatherInfo = weatherCodeInfo(current.weather_code);
        return {
          temp_c: current.temperature_2m,
          feels_c: current.apparent_temperature,
          humidity: current.relative_humidity_2m,
          wind_kmh: current.wind_speed_10m,
          is_day: current.is_day,
          description: weatherInfo.text,
          icon: weatherInfo.icon,
          hourly: hourly ? Array.from({ length: 24 }, (_, i) => ({
            time: new Date(hourly.time[i]).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),
            temp: hourly.temperature_2m[i],
            code: hourly.weather_code[i],
            precip: hourly.precipitation_probability[i]
          })) : []
        };
      } catch (e) {
        console.warn('Failed to fetch Bengaluru weather:', e);
        return null;
      }
    }

      const hierarchy = await fetchLocationHierarchy(BENGALURU_COORDS.lat, BENGALURU_COORDS.lon);

        setIsVerifying(true);

          (pos) => {
            const { latitude, longitude, accuracy } = pos.coords;
            setDeviceLocation({ lat: latitude, lon: longitude, accuracy });
            
            // Calculate distance from device to Vizianagaram
            const distance = calculateDistance(latitude, longitude, VIZIANAGARAM_COORDS.lat, VIZIANAGARAM_COORDS.lon);

            setLocationVerified(distance <= 50);
            setIsVerifying(false);

            setIsVerifying(false);

    // Enhanced Weather Map with live location-based functionality
    const LiveWeatherMap = ({ coords, markers, forecast, weather, height = 320, onLocationSelect, currentLocationLabel = 'Current Location' }) => {
      const mapRef = React.useRef(null);
      const mapId = 'live-weather-map-' + React.useId().replace(/:/g, '_');
      const markerLayerRef = React.useRef(null);
      const overlayLayerRef = React.useRef(null);
      const layerControlRef = React.useRef(null);
      const [mapReady, setMapReady] = React.useState(false);

      const getPrecipColor = (chance) => {
        if (chance >= 80) return '#ef4444';
        if (chance >= 60) return '#f97316';
        if (chance >= 35) return '#eab308';
        return '#38bdf8';
      };

      React.useEffect(() => {
        if (!mapRef.current) {
          mapRef.current = L.map(mapId, {
            center: [coords.lat, coords.lon],
            zoom: 6,
            scrollWheelZoom: true,
            dragging: true,
            zoomControl: true,
            doubleClickZoom: true,
            touchZoom: true,
            boxZoom: true,
            keyboard: true
          });

          // Dark theme layer
          const dark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { 
            attribution: '&copy; OpenStreetMap & CartoDB',
            maxZoom: 19
          });
          
          // Light theme layer
          const light = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
          });
          
          // Satellite layer (ESRI World Imagery)
          const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '&copy; Esri',
            maxZoom: 19
          });
          
          // Terrain layer
          const terrain = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenTopoMap',
            maxZoom: 17
          });

          // Add dark as default
          dark.addTo(mapRef.current);

          // Create layer control with all options
          layerControlRef.current = L.control.layers(
            { 
              '🌓 Dark': dark, 
              '☀️ Light': light,
              '🛰️ Satellite': satellite,
              '🏔️ Terrain': terrain
            },
            {},
            { collapsed: false, position: 'bottomleft' }
          ).addTo(mapRef.current);

          markerLayerRef.current = L.layerGroup().addTo(mapRef.current);
          overlayLayerRef.current = L.layerGroup().addTo(mapRef.current);
          
          // Enable map ready state
          setMapReady(true);
        }
        return () => {
          if (mapRef.current) {
            mapRef.current.remove();
            mapRef.current = null;
          }
        };
      }, [mapId]);

      React.useEffect(() => {
        if (!mapRef.current || !markerLayerRef.current || !overlayLayerRef.current) return;
        mapRef.current.setView([coords.lat, coords.lon], 6);
        markerLayerRef.current.clearLayers();
        overlayLayerRef.current.clearLayers();

        const activeWeather = weather?.description || 'Current weather';

        const pulseIcon = L.divIcon({
          className: '',
          html: '<div class="pulse-dot"></div>',
          iconSize: [16, 16],
          iconAnchor: [8, 8]
        });

        L.marker([coords.lat, coords.lon], { icon: pulseIcon })
          .addTo(markerLayerRef.current)
          .bindPopup(`<strong>Current location</strong><br/>${activeWeather}`);

        L.circle([coords.lat, coords.lon], {
          radius: 20000,
          color: '#60a5fa',
          fillColor: '#60a5fa',
          fillOpacity: 0.08,
          weight: 1
        }).addTo(overlayLayerRef.current);

        markers.forEach((m) => {
          if (m.primary) return;
          const marker = L.circleMarker([m.lat, m.lon], {
            radius: 7,
            color: '#facc15',
            fillColor: '#eab308',
            fillOpacity: 0.85,
            weight: 1
          });
          marker.bindPopup(`<strong>${m.name}</strong><br/>${m.detail}`);
          marker.on('click', () => {
            if (onLocationSelect) {
              onLocationSelect({ name: m.name, lat: m.lat, lon: m.lon });
            }
          });
          marker.addTo(markerLayerRef.current);
        });
        
        // Add click handler for the main location marker
        if (onLocationSelect) {
          const mainMarker = L.marker([coords.lat, coords.lon], { icon: pulseIcon });
          const safeLabel = String(currentLocationLabel).replace(/'/g, "\\'");
          mainMarker.bindPopup(`<strong>Current Location</strong><br/>${activeWeather}<br/><br/><button onclick="window.selectLocation && window.selectLocation(${coords.lat}, ${coords.lon}, '${safeLabel}')" class="text-blue-400 text-sm">Click to select</button>`);
          mainMarker.on('popupopen', () => {
            window.selectLocation = (lat, lon, name) => {
              onLocationSelect({ name, lat, lon });
            };
          });
          mainMarker.addTo(markerLayerRef.current);
        }

        const overlayPoints = (forecast || []).slice(0, 7).map((f, i) => {
          const chance = f.precip ?? 25;
          const angle = i * 0.85;
          const radius = 0.4 + i * 0.12;
          const lat = coords.lat + Math.cos(angle) * radius;
          const lon = coords.lon + Math.sin(angle) * radius;
          return { ...f, lat, lon, chance };
        });

        overlayPoints.forEach((p) => {
          L.circleMarker([p.lat, p.lon], {
            radius: 6 + Math.round(p.chance / 20),
            color: getPrecipColor(p.chance),
            fillColor: getPrecipColor(p.chance),
            fillOpacity: 0.45,
            weight: 1
          }).addTo(overlayLayerRef.current)
            .bindPopup(`<strong>${p.day}</strong><br/>${p.description}<br/>Precip: ${p.chance}%`);
        });
      }, [coords, markers, forecast, weather]);

      return (
        <div className="map-shell">
          <div id={mapId} style={{ height: `${height}px` }}></div>
          <div className="map-overlay">
            <h4>Precipitation Risk</h4>
            <div className="legend-row"><span><span className="legend-dot" style={{ background: '#ef4444' }}></span>Extreme</span><span>80%+</span></div>
            <div className="legend-row"><span><span className="legend-dot" style={{ background: '#f97316' }}></span>High</span><span>60-79%</span></div>
            <div className="legend-row"><span><span className="legend-dot" style={{ background: '#eab308' }}></span>Moderate</span><span>35-59%</span></div>
            <div className="legend-row"><span><span className="legend-dot" style={{ background: '#38bdf8' }}></span>Low</span><span>0-34%</span></div>
          </div>
        </div>
      );
    };

      const [selectedIso, setSelectedIso] = React.useState(todayIso);

      const weatherByIso = React.useMemo(() => {
        const out = {};
        forecast.forEach((f) => {
          out[f.iso] = { source: 'forecast', ...f };
        });
        history.forEach((h) => {
          if (!out[h.iso]) out[h.iso] = { source: 'history', ...h, temp: { max: h.max, min: h.min } };
        });
        return out;
      }, [forecast, history]);

      const monthDate = React.useMemo(() => {
        const d = new Date(today.getFullYear(), today.getMonth() + monthOffset, 1);
        return d;
      }, [today, monthOffset]);

      const daysInMonth = new Date(monthDate.getFullYear(), monthDate.getMonth() + 1, 0).getDate();
      const startWeekday = monthDate.getDay();
      const calendarCells = [];

      for (let i = 0; i < startWeekday; i++) calendarCells.push(null);
      for (let day = 1; day <= daysInMonth; day++) {
        const iso = new Date(monthDate.getFullYear(), monthDate.getMonth(), day).toISOString().split('T')[0];
        calendarCells.push({ day, iso, data: weatherByIso[iso] || null });

    }) => {

                    <p className="text-xs text-gray-400">
                      {distanceDiff < 1
