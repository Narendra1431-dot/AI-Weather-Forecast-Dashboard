    const App = () => {
      // Use translation hook to re-render when language changes
      useTranslation();
      
      const [active, setActive] = React.useState(() => {
        try {
          return localStorage.getItem('weathery_active_tab') || 'Dashboard';
        } catch {
          return 'Dashboard';
        }
      });
      const [loading, setLoading] = React.useState(true);
      const [coords, setCoords] = React.useState({ lat: 28.5383, lon: -81.3792 });
      const [locationName, setLocationName] = React.useState('Orlando, US');
      const [locationDetails, setLocationDetails] = React.useState({ state: 'Florida', district: 'Orange County', subdistrict: 'Orlando' });
      const [weather, setWeather] = React.useState(null);
      const [forecast, setForecast] = React.useState([]);
      const [hourly, setHourly] = React.useState([]);
      const [history, setHistory] = React.useState([]);
      const [alerts, setAlerts] = React.useState([]);
      const [search, setSearch] = React.useState('');
      const [refreshTick, setRefreshTick] = React.useState(0);
      const [searchHistory, setSearchHistory] = React.useState([]);
      const [dbStats, setDbStats] = React.useState({ locations: 0, favorites: 0, snapshots: 0, searches: 0 });
      const [serverStatus, setServerStatus] = React.useState({ dbReady: false });
      
      // Location verification state
      const [locationSource, setLocationSource] = React.useState('unknown');
      const [permissionStatus, setPermissionStatus] = React.useState('unknown');
      const [locationAccuracy, setLocationAccuracy] = React.useState(null);
      const [ipLocation, setIpLocation] = React.useState(null);
      const [deviceLocation, setDeviceLocation] = React.useState(null);
      const [isVerifying, setIsVerifying] = React.useState(false);
      const [verificationResult, setVerificationResult] = React.useState(null);
      const [recentLocations, setRecentLocations] = React.useState(() => {
        try {
          return JSON.parse(localStorage.getItem('weathery_recent_locations')) || [];
        } catch {
          return [];
        }
      });
      const [favorites, setFavorites] = React.useState(() => {
        try {
          return JSON.parse(localStorage.getItem('weathery_favorites')) || [];
        } catch {
          return [];
        }
      });
      const [settings, setSettings] = React.useState(() => {
        try {
          return JSON.parse(localStorage.getItem('weathery_settings')) || { tempUnit: 'celsius', windUnit: 'kmh', autoRefresh: true, refreshMins: 10 };
        } catch {
          return { tempUnit: 'celsius', windUnit: 'kmh', autoRefresh: true, refreshMins: 10 };
        }
      });

      React.useEffect(() => {
        localStorage.setItem('weathery_settings', JSON.stringify(settings));
      }, [settings]);

      React.useEffect(() => {
        localStorage.setItem('weathery_recent_locations', JSON.stringify(recentLocations));
      }, [recentLocations]);

      React.useEffect(() => {
        localStorage.setItem('weathery_favorites', JSON.stringify(favorites));
      }, [favorites]);

      React.useEffect(() => {
        localStorage.setItem('weathery_active_tab', active);
      }, [active]);

      const refreshBackendData = React.useCallback(async () => {
        const health = await apiRequest('/api/health');
        if (!health?.ok) {
          setServerStatus({ dbReady: false });
          return;
        }

        setServerStatus({ dbReady: !!health.dbReady });
        if (!health.dbReady) return;

        const [locRes, favRes, statsRes, historyRes] = await Promise.all([
          apiRequest('/api/data/locations'),
          apiRequest('/api/data/locations?favorite=true'),
          apiRequest('/api/data/dashboard'),
          apiRequest('/api/data/search-history?limit=12')
        ]);

        if (locRes?.ok && Array.isArray(locRes.data) && locRes.data.length > 0) setRecentLocations(locRes.data);
        if (favRes?.ok && Array.isArray(favRes.data)) setFavorites(favRes.data);
        if (statsRes?.ok && statsRes.data) {
          setDbStats({
            locations: statsRes.data.locations || 0,
            favorites: statsRes.data.favorites || 0,
            snapshots: statsRes.data.snapshots || 0,
            searches: statsRes.data.searches || 0
          });
        }
        if (historyRes?.ok && Array.isArray(historyRes.data)) setSearchHistory(historyRes.data);
      }, []);

      React.useEffect(() => {
        refreshBackendData();
      }, [refreshBackendData]);

      React.useEffect(() => {
        if (!settings.autoRefresh) return;
        const interval = setInterval(() => setRefreshTick((v) => v + 1), settings.refreshMins * 60000);
        return () => clearInterval(interval);
      }, [settings.autoRefresh, settings.refreshMins]);

      React.useEffect(() => {
        let watchId = null;
        let ipLocData = null;
        
        const applyCoords = (lat, lon, source = 'ip-fallback', accuracy = null) => {
          setCoords((prev) => {
            const moved = Math.abs(prev.lat - lat) + Math.abs(prev.lon - lon);
            if (moved < 0.0008) return prev;
            return { lat, lon };
          });
          setLocationSource(source);
          if (accuracy !== null) {
            setLocationAccuracy(accuracy);
          }
        };

        const verifyLocation = async (deviceLat, deviceLon) => {
          setIsVerifying(true);
          try {
            // Get IP location for comparison
            const ipLoc = await fetchIpLocationFallback();
            if (ipLoc && ipLoc.lat && ipLoc.lon) {
              setIpLocation(ipLoc);
              const distance = calculateDistance(deviceLat, deviceLon, ipLoc.lat, ipLoc.lon);
              const isAccurate = distance < 10; // Within 10km is considered accurate
              setVerificationResult({
                distanceKm: distance,
                isAccurate: isAccurate
              });
            }
          } catch (e) {
            console.error('Verification error:', e);
          } finally {
            setIsVerifying(false);
          }
        };

        const loadIpFallback = async () => {
          const ip = await fetchIpLocationFallback();
          if (!ip) {
            setPermissionStatus('unknown');
            return;
          }
          ipLocData = ip;
          setIpLocation(ip);
          setPermissionStatus('unknown'); // Can't determine from IP fallback
          applyCoords(ip.lat, ip.lon, 'ip-fallback');
        };

        const checkPermissionStatus = async () => {
          if (navigator.permissions) {
            try {
              const result = await navigator.permissions.query({ name: 'geolocation' });
              setPermissionStatus(result.state);
              result.addEventListener('change', () => {
                setPermissionStatus(result.state);
              });
            } catch (e) {
              // Permissions API not supported
              setPermissionStatus('unknown');
            }
          } else {
            setPermissionStatus('unknown');
          }
        };

        checkPermissionStatus();

        if (navigator.geolocation) {
          // First, get initial position
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              const { latitude, longitude, accuracy } = pos.coords;
              setDeviceLocation({ lat: latitude, lon: longitude });
              
              // Determine source based on accuracy
              const source = accuracy <= 100 ? 'device-gps' : 'device-network';
              applyCoords(latitude, longitude, source, accuracy);
              
              // Verify against IP location
              verifyLocation(latitude, longitude);
            },
            (err) => {
              console.warn('Geolocation error:', err.message);
              if (err.code === err.PERMISSION_DENIED) {
                setPermissionStatus('denied');
              }
              loadIpFallback();
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
          );

          // Then watch for changes
          watchId = navigator.geolocation.watchPosition(
            (pos) => {
              const { latitude, longitude, accuracy } = pos.coords;
              setDeviceLocation({ lat: latitude, lon: longitude });
              
              const source = accuracy <= 100 ? 'device-gps' : 'device-network';
              applyCoords(latitude, longitude, source, accuracy);
              
              // Re-verify periodically
              verifyLocation(latitude, longitude);
            },
            (err) => {
              if (err.code === err.PERMISSION_DENIED) {
                setPermissionStatus('denied');
              }
              loadIpFallback();
            },
            { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
          );
        } else {
          loadIpFallback();
        }

        return () => {
          if (watchId !== null && navigator.geolocation) navigator.geolocation.clearWatch(watchId);
        };
      }, []);

      React.useEffect(() => {
        const load = async () => {
          setLoading(true);
          try {
            const [bundle, archive] = await Promise.all([
              fetchForecastBundle(coords.lat, coords.lon),
              fetchHistory(coords.lat, coords.lon)
            ]);
            const hierarchy = await fetchLocationHierarchy(coords.lat, coords.lon);
            setLocationDetails(hierarchy);
            const resolvedLocationName = buildLocationLabel(hierarchy, locationName);
            setLocationName(resolvedLocationName);

            const currentCode = bundle.current.weather_code;
            const currentInfo = weatherCodeInfo(currentCode);
            const currentVisibility = bundle.hourly?.visibility?.[0] ?? 10000;

            setWeather({
              temp_c: bundle.current.temperature_2m,
              feels_c: bundle.current.apparent_temperature,
              humidity: bundle.current.relative_humidity_2m,
              wind_kmh: bundle.current.wind_speed_10m,
              visibility_m: currentVisibility,
              uv: bundle.daily.uv_index_max?.[0] ?? 5.5,
              description: currentInfo.text,
              icon: currentInfo.icon
            });

            const nextForecast = bundle.daily.time.map((date, i) => {
              const info = weatherCodeInfo(bundle.daily.weather_code[i]);
              return {
                iso: date,
                date: formatDate(date, { month: 'short', day: 'numeric' }),
                day: formatDate(date, { weekday: 'long' }),
                icon: info.icon,
                description: info.text,
                precip: bundle.daily.precipitation_probability_max?.[i] ?? 0,
                temp: {
                  max: bundle.daily.temperature_2m_max[i],
                  min: bundle.daily.temperature_2m_min[i]
                }
              };
            });
            setForecast(nextForecast);

            const nextHourly = bundle.hourly.time.map((time, i) => {
              const info = weatherCodeInfo(bundle.hourly.weather_code[i]);
              return {
                time,
                temp: bundle.hourly.temperature_2m[i],
                rainProb: bundle.hourly.precipitation_probability[i] ?? 0,
                icon: info.icon,
                description: info.text
              };
            });
            setHourly(nextHourly);

            const nextAlerts = bundle.daily.time.slice(0, 7).map((date, i) => {
              const precip = bundle.daily.precipitation_probability_max?.[i] ?? 0;
              const code = bundle.daily.weather_code[i];
              const label = weatherCodeInfo(code).text;
              if (precip >= 80 || code === 95 || code === 82) {
                return { date: formatDate(date, { weekday: 'short', month: 'short', day: 'numeric' }), level: 'high', message: `High risk: ${label}, precipitation chance ${precip}%` };
              }
              if (precip >= 60) {
                return { date: formatDate(date, { weekday: 'short', month: 'short', day: 'numeric' }), level: 'medium', message: `Watch conditions: ${label}, precipitation chance ${precip}%` };
              }
              return null;
            }).filter(Boolean);
            setAlerts(nextAlerts);

            const historyRows = archive.daily.time.map((date, i) => {
              const info = weatherCodeInfo(archive.daily.weather_code[i]);
              return {
                iso: date,
                date: formatDate(date, { weekday: 'short', month: 'short', day: 'numeric' }),
                max: archive.daily.temperature_2m_max[i],
                min: archive.daily.temperature_2m_min[i],
                rain: archive.daily.precipitation_sum[i],
                description: info.text,
                icon: info.icon
              };
            });
            setHistory(historyRows);

            await apiRequest('/api/data/weather-snapshots', {
              method: 'POST',
              data: {
                locationName: resolvedLocationName,
                lat: coords.lat,
                lon: coords.lon,
                tempC: bundle.current.temperature_2m,
                humidity: bundle.current.relative_humidity_2m,
                windKmh: bundle.current.wind_speed_10m,
                uv: bundle.daily.uv_index_max?.[0] ?? 0,
                condition: currentInfo.text,
                capturedAt: new Date().toISOString()
              }
            });

            await refreshBackendData();
          } catch {
            setLocationDetails({ state: 'Unknown State', district: 'Unknown District', subdistrict: 'Unknown Subdistrict' });
            setWeather({
              temp_c: 28,
              feels_c: 27,
              humidity: 72,
              wind_kmh: 11,
              visibility_m: 10000,
              uv: 5.5,
              description: 'Rainy',
              icon: 'Rain'
            });
            setForecast([]);
            setHourly([]);
            setHistory([]);
            setAlerts([]);
          } finally {
            setLoading(false);
          }
        };
        load();
      }, [coords, refreshTick]);

      const handleSearch = async () => {
        const city = search.trim();
        if (!city) return;
        try {
          const found = await geocodeCity(city);
          if (!found.length) {
            alert('Location not found');
            return;
          }
          const top = found[0];
          setCoords({ lat: top.latitude, lon: top.longitude });
          setLocationName(`${top.name}, ${top.country_code || top.country || ''}`.replace(/,\s*$/, ''));
          setLocationDetails({
            state: top.admin1 || 'Unknown State',
            district: top.admin2 || 'Unknown District',
            subdistrict: top.admin3 || top.admin4 || 'Unknown Subdistrict'
          });
          setRecentLocations((prev) => {
            const row = {
              name: top.name,
              country: top.country_code || top.country || '',
              state: top.admin1 || 'Unknown State',
              district: top.admin2 || 'Unknown District',
              subdistrict: top.admin3 || top.admin4 || 'Unknown Subdistrict',
              lat: top.latitude,
              lon: top.longitude,
              lastViewed: new Date().toISOString()
            };
            const dedupe = prev.filter((p) => `${p.name}-${p.country}` !== `${row.name}-${row.country}`);
            return [row, ...dedupe].slice(0, 8);
          });

          await apiRequest('/api/data/locations/upsert', {
            method: 'POST',
            data: {
              name: top.name,
              country: top.country_code || top.country || '',
              state: top.admin1 || 'Unknown State',
              district: top.admin2 || 'Unknown District',
              subdistrict: top.admin3 || top.admin4 || 'Unknown Subdistrict',
              lat: top.latitude,
              lon: top.longitude
            }
          });

          await apiRequest('/api/data/search-history', {
            method: 'POST',
            data: {
              query: city,
              selectedName: top.name,
              state: top.admin1 || '',
              district: top.admin2 || '',
              subdistrict: top.admin3 || top.admin4 || ''
            }
          });

          await refreshBackendData();
          setSearch('');
        } catch {
          alert('Geocoding error');
        }
      };

      const mapMarkers = React.useMemo(() => {
        const currentDetail = weather 
          ? `${Math.round(weather.temp_c)}°C · ${weather.description} · ${locationDetails.city || locationName}` 
          : `${locationDetails.state || 'State'}/${locationDetails.district || 'District'}`;
        const current = [{ name: locationName, lat: coords.lat, lon: coords.lon, detail: currentDetail, primary: true }];
        const recents = recentLocations.map((loc) => ({
          name: `${loc.name}, ${loc.country}`,
          lat: loc.lat,
          lon: loc.lon,
          detail: `${loc.state || loc.district ? (loc.state + ' / ' + loc.district) : 'India'} ${loc.subdistrict ? ' / ' + loc.subdistrict : ''}`,
          primary: false
        }));
        return [...current, ...recents];
      }, [coords, recentLocations, locationName, weather, locationDetails]);

      const exportHistoryCsv = () => {
        const header = 'date,description,max_temp_c,min_temp_c,rain_mm';
        const rows = history.map((h) => `${h.date},${h.description},${h.max},${h.min},${h.rain}`);
        downloadTextFile('weather-history.csv', [header, ...rows].join('\n'));
      };

      const exportForecastCsv = () => {
        const header = 'date,day,description,max_temp_c,min_temp_c';
        const rows = forecast.map((f) => `${f.date},${f.day},${f.description},${f.temp.max},${f.temp.min}`);
        downloadTextFile('weather-forecast.csv', [header, ...rows].join('\n'));
      };

      const toggleFavorite = (loc) => {
        const key = `${loc.name}-${loc.country}`;
        const willFavorite = !favorites.some((p) => `${p.name}-${p.country}` === key);
        setFavorites((prev) => {
          const exists = prev.some((p) => `${p.name}-${p.country}` === key);
          if (exists) return prev.filter((p) => `${p.name}-${p.country}` !== key);
          return [{ name: loc.name, country: loc.country, state: loc.state, district: loc.district, subdistrict: loc.subdistrict, lat: loc.lat, lon: loc.lon }, ...prev].slice(0, 8);
        });

        apiRequest('/api/data/locations/favorite', {
          method: 'PATCH',
          data: {
            name: loc.name,
            country: loc.country || '',
            isFavorite: willFavorite
          }
        }).then(() => refreshBackendData());
      };

      const requestDeviceLocation = () => {
        if (!navigator.geolocation) {
          alert('Geolocation is not supported by your browser');
          return;
        }

        setIsVerifying(true);
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const { latitude, longitude, accuracy } = pos.coords;
            setDeviceLocation({ lat: latitude, lon: longitude });
            const source = accuracy <= 100 ? 'device-gps' : 'device-network';
            setLocationSource(source);
            setLocationAccuracy(accuracy);
            setCoords({ lat: latitude, lon: longitude });
            
            // Verify against IP
            fetchIpLocationFallback().then((ipLoc) => {
              if (ipLoc && ipLoc.lat && ipLoc.lon) {
                setIpLocation(ipLoc);
                const distance = calculateDistance(latitude, longitude, ipLoc.lat, ipLoc.lon);
                setVerificationResult({
                  distanceKm: distance,
                  isAccurate: distance < 10
                });
              }
              setIsVerifying(false);
            });
          },
          (err) => {
            setIsVerifying(false);
            if (err.code === err.PERMISSION_DENIED) {
              setPermissionStatus('denied');
              alert('Location permission denied. Please enable location access in your browser settings.');
            } else if (err.code === err.POSITION_UNAVAILABLE) {
              alert('Location information is unavailable. Using IP-based location instead.');
            } else if (err.code === err.TIMEOUT) {
              alert('Location request timed out. Please try again.');
            }
          },
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
      };

      if (loading && !weather) {
        return <div className="min-h-screen flex items-center justify-center"><div className="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div></div>;
      }

      return (
        <div className="flex">
          <Sidebar active={active} onChange={setActive} weather={weather} settings={settings} />
          <main className="flex-1 ml-0 md:ml-24 p-4 lg:p-6">
            <div className="md:hidden mb-4 overflow-x-auto pb-1">
              <div className="flex gap-2 min-w-max">
                {SIDEBAR_ITEMS.map((item) => (
                  <button
                    key={item}
                    onClick={() => setActive(item)}
                    className={`px-3 py-2 rounded-full text-xs ${active === item ? 'bg-blue-500 text-white' : 'bg-white/10 text-gray-300'}`}
                  >
                    {item}
                  </button>
                ))}
              </div>
            </div>

            <div className="mb-5 grid grid-cols-1 md:grid-cols-3 gap-3">
              <div className="md:col-span-2 flex gap-2">
                <input
                  value={search}
                  type="text"
                  placeholder="Search city..."
                  className="glass border border-white/20 rounded-full px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/50 w-full"
                  onChange={(e) => setSearch(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && handleSearch()}
                />
                <button onClick={handleSearch} className="px-4 py-2 rounded-full bg-blue-500 hover:bg-blue-400 text-white text-sm">Search</button>
              </div>
              <div className="glass rounded-full px-4 py-2 text-sm text-gray-300 text-center md:text-right">Active tab: {active}</div>
            </div>

            {/* District Quick Search */}
            <div className="mb-4 flex flex-wrap items-center gap-3">
              <DistrictQuickSearch 
                onSelectDistrict={(district) => {
                  setCoords({ lat: district.lat, lon: district.lon });
                  setLocationName(`${district.name}, ${district.state}`);
                  setLocationDetails({
                    state: district.state,
                    district: district.name,
                    subdistrict: district.name
                  });
                  // Save to recent locations
                  const row = {
                    name: district.name,
                    country: 'India',
                    state: district.state,
                    district: district.name,
                    subdistrict: district.name,
                    lat: district.lat,
                    lon: district.lon,
                    lastViewed: new Date().toISOString()
                  };
                  setRecentLocations((prev) => {
                    const dedupe = prev.filter((p) => `${p.name}-${p.country}` !== `${row.name}-${row.country}`);
                    return [row, ...dedupe].slice(0, 8);
                  });
                }}
                currentLocation={locationName}
              />
              
              {/* Quick Search Pills */}
              <div className="flex flex-wrap gap-2">
                <span className="text-xs text-gray-400 self-center">Popular:</span>
                {['Visakhapatnam', 'Vijayawada', 'Bengaluru', 'Hyderabad', 'Chennai', 'Mumbai', 'Delhi', 'Kolkata'].map((city) => (
                  <button
                    key={city}
                    onClick={() => { setSearch(city); setTimeout(handleSearch, 100); }}
                    className="px-2 py-1 text-xs rounded-full bg-white/5 hover:bg-white/20 border border-white/10 text-gray-300 transition-all hover:border-blue-400/50"
                  >
                    {city}
                  </button>
                ))}
              </div>
            </div>

            {active === 'Dashboard' && (
              <>
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  <div className="lg:col-span-2 space-y-6">
                    <WeatherCard weather={weather} location={locationName} settings={settings} />
                    <ForecastList forecast={forecast} settings={settings} />
                    <HourlyPanel hourly={hourly} settings={settings} />
                  </div>
                  <div className="space-y-6">
                    <EnhancedDataDisplay weather={weather} locationDetails={locationDetails} settings={settings} coords={coords} />
                    
                    {/* Air Quality Quick View */}
                    <div className="glass-card rounded-3xl p-5">
                      <div className="flex items-center justify-between mb-3">
                        <h3 className="text-lg font-semibold text-white/80">💨 Air Quality</h3>
                        <button 
                          onClick={() => setActive('AirQuality')}
                          className="text-xs text-blue-400 hover:text-blue-300"
                        >
                          View Details →
                        </button>
                      </div>
                      <AQIMapLayer 
                        coords={coords} 
                        onMarkerClick={(aqi) => {
                          window._currentAirQuality = aqi;
                          setRefreshTick(t => t + 1);
                        }} 
                      />
                    </div>
                    
                    <HighlightCards weather={weather} settings={settings} />
                    <AlertsPanel alerts={alerts} />
                    <DatabaseInsights stats={dbStats} serverStatus={serverStatus} searches={searchHistory.slice(0, 6)} />
                  </div>
                </div>
                
                {/* Location Verification Panel - Always visible on Dashboard */}
                <div className="mt-6">
                  <LocationVerificationPanel
                    locationSource={locationSource}
                    permissionStatus={permissionStatus}
                    locationAccuracy={locationAccuracy}
                    ipLocation={ipLocation}
                    deviceLocation={deviceLocation}
                    onRequestLocation={requestDeviceLocation}
                    isVerifying={isVerifying}
                    verificationResult={verificationResult}
                  />
                </div>

                <div className="mt-6 glass-card rounded-3xl p-5">
                  <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                    <h3 className="text-xl font-semibold text-white/80">🗺️ Live Weather Map</h3>
                    <div className="flex items-center gap-2">
                      <span className="text-xs text-gray-400 bg-white/10 rounded-full px-3 py-1">
                        📍 {locationDetails?.district || 'Current Location'}
                      </span>
                      <span className="text-xs text-gray-300 bg-blue-500/20 rounded-full px-3 py-1">
                        Live Updates
                      </span>
                    </div>
                  </div>
                  <LiveWeatherMap 
                    coords={coords} 
                    markers={mapMarkers} 
                    forecast={forecast} 
                    weather={weather} 
                    height={340}
                    onLocationSelect={(location) => {
                      setCoords({ lat: location.lat, lon: location.lon });
                      setLocationName(location.name);
                    }}
                  />
                  <div className="mt-3 flex flex-wrap gap-4 text-sm">
                    <div className="bg-white/5 px-3 py-1 rounded-lg">
                      <span className="text-gray-400">Center:</span>
                      <span className="text-white ml-2">{coords.lat.toFixed(4)}°N, {coords.lon.toFixed(4)}°E</span>
                    </div>
                    <div className="bg-white/5 px-3 py-1 rounded-lg">
                      <span className="text-gray-400">Zoom:</span>
                      <span className="text-white ml-2">6 (Regional)</span>
                    </div>
                    <div className="bg-white/5 px-3 py-1 rounded-lg">
                      <span className="text-gray-400">Markers:</span>
                      <span className="text-white ml-2">{mapMarkers.length} locations</span>
                    </div>
                  </div>
                </div>
                <div className="mt-6">
                  <ConditionLocationPanel weather={weather} locationDetails={locationDetails} />
                </div>
              </>
            )}

            {active === 'Forecast' && (
              <div className="space-y-6">
                <ForecastList forecast={forecast} settings={settings} title="14 days Forecast" days={14} />
                <HourlyPanel hourly={hourly} settings={settings} />
              </div>
            )}

            {active === 'Map' && (
              <div className="glass-card rounded-3xl p-5">
                <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                  <h3 className="text-xl font-semibold text-white/80">🗺️ Interactive Weather Map</h3>
                  <div className="flex items-center gap-2">
                    <span className="text-xs text-gray-300 bg-white/10 rounded-full px-3 py-1">
                      Click markers to view details
                    </span>
                    <span className="text-xs text-gray-300 bg-blue-500/20 rounded-full px-3 py-1">
                      Switch Dark/Light layer
                    </span>
                  </div>
                </div>
                <LiveWeatherMap 
                  coords={coords} 
                  markers={mapMarkers} 
                  forecast={forecast} 
                  weather={weather} 
                  height={520}
                  onLocationSelect={(location) => {
                    setCoords({ lat: location.lat, lon: location.lon });
                    setLocationName(location.name);
                  }}
                />
                <div className="mt-4 p-4 bg-gradient-to-r from-blue-500/10 to-purple-500/10 rounded-xl border border-white/10">
                  <h4 className="text-sm font-semibold text-white mb-2">📍 Current Location Details</h4>
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-sm">
                    <div className="bg-white/5 rounded-lg p-2">
                      <p className="text-gray-400 text-xs">City</p>
                      <p className="text-white">{locationDetails?.city || 'N/A'}</p>
                    </div>
                    <div className="bg-white/5 rounded-lg p-2">
                      <p className="text-gray-400 text-xs">State</p>
                      <p className="text-white">{locationDetails?.state || 'N/A'}</p>
                    </div>
                    <div className="bg-white/5 rounded-lg p-2">
                      <p className="text-gray-400 text-xs">District</p>
                      <p className="text-white">{locationDetails?.district || 'N/A'}</p>
                    </div>
                    <div className="bg-white/5 rounded-lg p-2">
                      <p className="text-gray-400 text-xs">Subdistrict</p>
                      <p className="text-white">{locationDetails?.subdistrict || 'N/A'}</p>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {active === 'AirQuality' && (
              <div className="space-y-6">
                <AirQualityPanel 
                  airQuality={window._currentAirQuality || null} 
                  locationName={locationName} 
                />
                
                {/* Air Quality Map */}
                <div className="glass-card rounded-3xl p-5">
                  <h3 className="text-xl font-semibold text-white/80 mb-4">🗺️ Air Quality Map</h3>
                  <div className="h-96 rounded-xl overflow-hidden">
                    <AQIMapLayer 
                      coords={coords} 
                      onMarkerClick={(aqi) => {
                        window._currentAirQuality = aqi;
                        // Force re-render by updating a state
                        setRefreshTick(t => t + 1);
                      }} 
                    />
                  </div>
                </div>
                
                {/* AQI Scale Legend */}
                <div className="glass-card rounded-3xl p-5">
                  <h3 className="text-lg font-semibold text-white/80 mb-3">📊 AQI Scale Guide</h3>
                  <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-2 text-xs">
                    {[
                      { range: '0-50', label: 'Good', color: '#10b981' },
                      { range: '51-100', label: 'Moderate', color: '#facc15' },
                      { range: '101-150', label: 'Unhealthy for Sensitive', color: '#f97316' },
                      { range: '151-200', label: 'Unhealthy', color: '#ef4444' },
                      { range: '201-300', label: 'Very Unhealthy', color: '#a855f7' },
                      { range: '301+', label: 'Hazardous', color: '#7f1d1d' }
                    ].map((item, idx) => (
                      <div key={idx} className="rounded-lg p-2 text-center" style={{ backgroundColor: item.color + '20' }}>
                        <div className="w-4 h-4 rounded-full mx-auto mb-1" style={{ backgroundColor: item.color }}></div>
                        <p className="text-gray-300">{item.range}</p>
                        <p style={{ color: item.color }}>{item.label}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {active === 'Locations' && (
              <LocationsPanel
                recentLocations={recentLocations}
                favorites={favorites}
                onToggleFavorite={toggleFavorite}
                onSelect={(loc) => {
                  setCoords({ lat: loc.lat, lon: loc.lon });
                  setLocationName(`${loc.name}, ${loc.country}`);
                  setLocationDetails({
                    state: loc.state || 'Unknown State',
                    district: loc.district || 'Unknown District',
                    subdistrict: loc.subdistrict || 'Unknown Subdistrict'
                  });
                }}
              />
            )}

            {active === 'History' && <HistoryPanel history={history} settings={settings} onExport={exportHistoryCsv} />}

            {active === 'Calendar' && <CalendarPanel forecast={forecast} history={history} settings={settings} />}

            {active === 'Vizianagaram' && <VizianagaramLiveWeatherMap settings={settings} />}
            
            {active === 'Bengaluru' && <BengaluruPanel settings={settings} />}

            {active === 'Settings' && (
              <div className="space-y-6">
                <SettingsPanel
                  settings={settings}
                  onUpdate={setSettings}
                  onRefreshNow={() => setRefreshTick((v) => v + 1)}
                  onExportForecast={exportForecastCsv}
                />
                <DatabaseInsights stats={dbStats} serverStatus={serverStatus} searches={searchHistory} />
              </div>
            )}
          </main>
          
          {/* AI Assistant Bot - Always visible */}
          <AIAssistantBot 
            currentWeather={weather} 
            currentLocation={locationName} 
            locationDetails={locationDetails}
          />
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
